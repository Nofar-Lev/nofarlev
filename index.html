<style>
:root {
  --navy: #0a1f44;      /* ground */
  --ice: #f4f8ff;       /* main text, logo letters */
  --mist: #a9bbd6;      /* secondary text */
  --line: #1d3563;      /* rules */
  --deep: #071834;      /* the darker band */
  --accent: #22d3ee;    /* the lambda. Official: electric cyan. Never purple. */
  --soft: Fredoka, "Trebuchet MS", "Segoe UI", sans-serif;
  --crisp: "STIX Two Text", "Iowan Old Style", Georgia, serif;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--navy); color: var(--ice); font: 400 1.1875rem/1.65 var(--crisp); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-underline-offset: 0.18em; text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 4px; }
.wrap { width: min(100% - 3rem, 58rem); margin-inline: auto; }

.hero { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; justify-content: center; padding-block: 4rem; }
.logo { display: block; width: min(100%, 35rem); height: auto; overflow: visible; }
.logo .letters { fill: var(--ice); }
.logo .lambda { fill: var(--accent); cursor: pointer; transition: fill 0.25s ease; }
.logo .lambda:focus { outline: none; }
.logo .lambda:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; }
.name { margin: 2.25rem 0 0; font: 500 1.5rem/1.2 var(--soft); }
.line { margin: 0.5rem 0 0; color: var(--mist); min-height: 1.65em; }
.cursor { display: inline-block; width: 0.5em; height: 1.05em; margin-left: 0.15em; vertical-align: -0.16em; border-radius: 2px; background: var(--accent); animation: lubdub 1s linear infinite; }
/* one beat per second, 60 bpm: two quick dips (lub, dub), then rest */
@keyframes lubdub { 0%, 16%, 34%, 100% { opacity: 1; } 8%, 25% { opacity: 0.12; } }
.hint { margin: 3.5rem 0 0; font: 400 0.9375rem/1.4 var(--soft); color: var(--mist); }

.beat { display: flex; align-items: center; color: var(--accent); }
.beat::before { content: ""; flex: 0 0 max(1.5rem, calc((100% - 58rem) / 2 + 11rem)); border-top: 2px solid var(--line); }
.beat::after { content: ""; flex: 1; border-top: 2px solid var(--line); }
.beat svg { flex: none; width: 9rem; height: auto; overflow: visible; }
section { padding-block: 4.5rem; }
section.deep { background: var(--deep); }
section > .wrap { display: grid; grid-template-columns: 1fr; gap: 1.25rem 3rem; }
@media (min-width: 46rem) { section > .wrap { grid-template-columns: 11rem minmax(0, 1fr); } }
.lead { font: 500 clamp(1.6rem, 1.1rem + 2vw, 2.4rem)/1.2 var(--soft); margin: 0 0 1.5rem; max-width: 20em; text-wrap: balance; }
.grid2 { display: grid; grid-template-columns: 1fr; gap: 3rem 3.5rem; }
@media (min-width: 38rem) { .grid2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.glyph { height: 3.75rem; display: flex; align-items: center; margin-bottom: 1rem; color: var(--accent); }
.glyph svg { height: 100%; width: auto; overflow: visible; }
.glyph .logic { font: 500 3.4rem/1 var(--soft); letter-spacing: 0.06em; }
.glyph .logic span { display: inline-block; }
.glyph .logic .a { transform: rotate(180deg); }
.glyph .logic .e { transform: scaleX(-1); }
h3 { margin: 0 0 0.35rem; font: 500 1.375rem/1.25 var(--soft); }
.grid2 p { color: var(--mist); }
.big-link { font: 500 clamp(1.5rem, 1rem + 2vw, 2.1rem)/1.25 var(--soft); }
h2 { margin: 0; font: 500 1.375rem/1.3 var(--soft); color: var(--accent); }
section p { margin: 0 0 1.1em; max-width: 38em; }
section p:last-child { margin-bottom: 0; }
dl { margin: 0; display: grid; gap: 2rem; max-width: 38em; }
dt { font: 500 1.375rem/1.25 var(--soft); }
dd { margin: 0.3rem 0 0; color: var(--mist); }
.todo { color: var(--mist); font-style: italic; }
ul.plain { list-style: none; margin: 1.25rem 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0.5rem 2rem; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .cursor { animation: none; }
  .logo .lambda { transition: none; }
}
</style>

<script>
// The lambda's color is the one part of the logo that may change. These are the approved
// accents for the navy ground: each is the warm-leaning shade of its hue, and none is purple.
// Ordered so that each click is an obvious change: neighbours are far apart on the color wheel.
var accents = ['#22d3ee', '#b6f23c', '#45b8ff', '#ffd43b', '#3ce6a8', '#ff8a8a'];
var current = 0;
var lambda = document.getElementById('lambda');
function nextAccent() {
  current = (current + 1) % accents.length;
  document.documentElement.style.setProperty('--accent', accents[current]);
}
lambda.addEventListener('click', nextAccent);
lambda.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); nextAccent(); }
});

// Type the line once on load. With reduced motion, show it at once.
var typed = document.getElementById('typed');
var text = typed.textContent; // the line is in the HTML itself, so it is there even without JavaScript
if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  typed.textContent = '';
  var i = 0;
  (function tick() {
    typed.textContent = text.slice(0, ++i);
    if (i < text.length) setTimeout(tick, 34);
  })();
}
</script>
